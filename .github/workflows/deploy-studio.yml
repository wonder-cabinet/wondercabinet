name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-studio.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Builds and publishes the hosted Studio (wonder-cabinet.sanity.studio).
      # Needs a Sanity token with deploy rights saved as the repo secret
      # SANITY_AUTH_TOKEN (GitHub > Settings > Secrets and variables > Actions).
      - name: Deploy Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity deploy -y

      # Refreshes the schema registry so tools outside Studio (e.g. Claude's
      # Sanity connector) see new types. Non-fatal if it fails.
      - name: Deploy schema registry
        continue-on-error: true
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest schema deploy
