<!doctype html>
<html lang="en" data-lang="en" style="--bg: #AFD214;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Wonder Cabinet – مجلس العجب · Bethlehem, Palestine</title>
<meta name="description" content="A space for art production and cultural development in Bethlehem, Palestine.">
<meta property="og:type" content="article">
<meta property="og:site_name" content="The Wonder Cabinet">
<meta property="og:title" content="The Wonder Cabinet" id="og-title-meta">
<meta property="og:description" content="A space for art production and cultural development in Bethlehem, Palestine." id="og-desc-meta">
<meta property="og:image" content="" id="og-image-meta">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/app.css?v=92" />
<style>
  /* This page uses the exact same .ep-* / .event-panel template as every
     other entry point on the site (the homepage hero cards, the Programme
     timeline rows) used to render — this is now the single, canonical
     event template, just laid out in-flow instead of as a slide-in panel. */
  .event-panel.is-page{
    position: static;
    width: 100%; max-width: 860px; margin: 0 auto;
    min-height: 50vh;
    transform: none; box-shadow: none;
    /* The base .event-panel rule sets overflow:auto for the old slide-in
       drawer, which (even with no actual scrollbar) still makes this div
       the sticky positioning container for its descendants — breaking
       the ticket bar's "stick to the real viewport" behavior. Since this
       page scrolls normally (no internal drawer), let descendants stick
       to the actual page viewport instead. */
    overflow: visible;
  }
  .event-page-wrap{ padding-top: clamp(16px, 3vw, 32px); min-height: 60vh; }
  /* Standalone page gets the site's real topbar (logo, Programme, Archive,
     language, close) instead of a bare floating language toggle — this
     page should feel like a page of the site, not an isolated popup. */
  html.embed .topbar{ display: none !important; }

  /* ---- EMBED MODE (?embed=1) ----
     The same page, hosted inside the homepage grid's expanding reader
     block (an iframe). Chrome is stripped (lang toggle, footer, "also
     this month"), the panel fills the frame edge-to-edge, the title
     stays sticky while everything scrolls beneath it, and a hero video
     (the same one the grid card uses as its background) sits at the top
     of the flow so it scrolls away as you read. */
  html.embed{ overscroll-behavior: none; }
  html.embed .more{ display: none !important; }
  html.embed .foot{ display: none !important; }
  html.embed .event-page-wrap{ padding-top: 0; min-height: 0; }
  html.embed .event-panel.is-page{ max-width: none; margin: 0; min-height: 100vh; }
  /* The whole header — date, type, title — stays pinned together at the
     top as one unit while the rest of the content scrolls underneath it. */
  html.embed .ep-header{
    position: sticky;
    top: 0;
    z-index: 30;
    background: inherit;
  }
  html.embed .ep-title{ padding: 10px 80px 10px 0; }
  /* Close / pop-out always reachable, pinned to the frame itself. */
  html.embed .ep-close, html.embed .ep-pop{ position: fixed; top: 14px; z-index: 60; }
  html.embed .ep-close{ right: 14px; }
  html.embed .ep-pop{ right: 46px; }
  /* Arabic: flip to left side */
  html[data-lang="ar"].embed .ep-title{ padding: 10px 0 10px 80px; }
  html[data-lang="ar"].embed .ep-close{ right: auto; left: 14px; }
  html[data-lang="ar"].embed .ep-pop{ right: auto; left: 46px; }
  .ep-hero-video video{ width: 100%; display: block; }
  /* Extra runway at the very end of the article — reaching the true bottom
     shouldn't feel like slamming into a wall right as the content stops, so
     there's an empty half-viewport of "cushion" before the end-of-scroll
     gravity in the parent page even engages. */
  .ep-embed-spacer{ height: 50vh; }
  .ep-pop{
    all: unset; cursor: pointer;
    display: grid; place-items: center;
    color: currentColor;
    width: 28px; height: 28px;
    opacity: .75; transition: opacity .15s;
  }
  .ep-pop svg{ display: block; width: 18px; height: 18px; }
  .ep-pop:hover{ opacity: 1; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="tpb-logo" href="index.html">
      <span class="logo" role="img" aria-label="The Wonder Cabinet"></span>
    </a>
    <nav class="tpb-nav">
      <a href="index.html#programme"><span class="en-only">Programme</span><span class="ar-only ar">البرنامج</span></a>
      <a href="index.html"><span class="en-only">Archive</span><span class="ar-only ar">الأرشيف</span></a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button data-lang-btn="en" aria-pressed="true">EN</button>
        <button data-lang-btn="ar" aria-pressed="false">AR</button>
      </div>
      <a id="epClose" href="index.html" aria-label="Close"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 4l10 10M14 4L4 14"/></svg></a>
    </nav>
  </div>
</header>

<main class="event-page-wrap">
  <div class="event-panel is-page" id="epRoot" style="background:var(--paper);color:var(--night);"></div>
</main>

<footer class="foot" id="visit"></footer>
<script src="assets/footer.js"></script>

<script>
(async function(){
  const SANITY_PROJECT = 'xdtj605l', SANITY_DATASET = 'production';
  const MABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DWEN  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const DWAR  = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const DWFULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MFULL  = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const MONTH_NAME_AR = { Jan:"يناير", Feb:"فبراير", Mar:"مارس", Apr:"أبريل", May:"مايو", Jun:"يونيو", Jul:"يوليو", Aug:"أغسطس", Sep:"سبتمبر", Oct:"أكتوبر", Nov:"نوفمبر", Dec:"ديسمبر" };
  const TYPE_AR = { Class:"صف", Film:"فيلم", Performance:"عرض", Radio:"إذاعة", Reading:"قراءة", Workshop:"ورشة", "Open Studio":"استوديو مفتوح", Opening:"افتتاح", Bar:"بار", Exhibition:"معرض" };

  const TYPE_COLORS = {
    Performance: { bg: "#cc6698", ink: "#0a0a16" },
    Film:        { bg: "#ffe600", ink: "#0a0a16" },
    Class:       { bg: "#c8a0f0", ink: "#0a0a16" },
    Workshop:    { bg: "#ff5a00", ink: "#f6f3ea" },
    "Open Studio": { bg: "#ff5a00", ink: "#f6f3ea" },
    Radio:       { bg: "#00d26a", ink: "#0a0a16" },
    Reading:     { bg: "#ffd6c2", ink: "#0a0a16" },
    Opening:     { bg: "#0a0a16", ink: "#f6f3ea" },
    Bar:         { bg: "#e8a33d", ink: "#0a0a16" },
    Exhibition:  { bg: "#1d24ff", ink: "#f6f3ea" },
  };
  const COLOR_THEME_OVERRIDES = {
    performance: TYPE_COLORS.Performance, film: TYPE_COLORS.Film, class: TYPE_COLORS.Class,
    workshop: TYPE_COLORS.Workshop, "open studio": TYPE_COLORS["Open Studio"],
    radio: TYPE_COLORS.Radio, reading: TYPE_COLORS.Reading,
    opening: TYPE_COLORS.Opening, bar: TYPE_COLORS.Bar,
    exhibition: TYPE_COLORS.Exhibition,
    paper: { bg: "#FCFFE5", ink: "#0a0a16" },
  };
  function _colorFor(ev, fallback){
    if (ev.colorTheme && COLOR_THEME_OVERRIDES[ev.colorTheme]) return COLOR_THEME_OVERRIDES[ev.colorTheme];
    return TYPE_COLORS[ev.type] || fallback;
  }
  function arNum(s){ return String(s).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]); }
  function _overlayDate(ev){ return `${parseInt(ev.day)} ${MFULL[MABBR.indexOf(ev.month)]} ${ev.year}`; }
  function _ordinal(n){ const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); }

  function _iso(dt){
    if (!dt) return null;
    const d = new Date(dt);
    return isNaN(d) ? null : d;
  }
  function _sanityImg(ref){
    const r = typeof ref === 'string' ? ref : (ref && ref.asset && ref.asset._ref) || '';
    if (!r) return '';
    const id = r.replace(/^image-/, '').replace(/-([a-z0-9]+)$/, '.$1');
    return `https://cdn.sanity.io/images/${SANITY_PROJECT}/${SANITY_DATASET}/${id}`;
  }
  function _sanityFile(ref){
    const r = typeof ref === 'string' ? ref : (ref && ref.asset && ref.asset._ref) || '';
    if (!r) return '';
    const id = r.replace(/^file-/, '').replace(/-([a-z0-9]+)$/, '.$1');
    return `https://cdn.sanity.io/files/${SANITY_PROJECT}/${SANITY_DATASET}/${id}`;
  }
  function _loc(v){ return typeof v === 'object' && v !== null ? (v.en || v.ar || '') : (v || ''); }

  /* Sanity auto-computes a color palette for every uploaded image
     (metadata.palette). Prefer darkVibrant when it's meaningfully present
     in the image (population > 5%) — it tends to give the richest,
     most "poster-like" color. Fall back to dominant (always representative,
     even for muted/grayscale art), then vibrant, then null (no palette —
     e.g. very old assets or SVGs, which Sanity doesn't palette-analyze).
     Kept in sync with the identical picker in index.html — not shared via
     import since this is a static, no-build site. */
  function _pickPalette(p){
    if (!p) return null;
    let sw = null;
    if (p.darkVibrant && p.darkVibrant.background && p.darkVibrant.population > 5) sw = p.darkVibrant;
    else if (p.dominant && p.dominant.background) sw = p.dominant;
    else if (p.vibrant && p.vibrant.background) sw = p.vibrant;
    if (!sw) return null;
    return { bg: sw.background, ink: sw.foreground || '#111318' };
  }

  function docToEv(doc){
    const s = _iso(doc.startDateTime), e = _iso(doc.endDateTime);
    // hasTime: check UTC hours in raw string (midnight UTC = 00:00Z = all-day, no display time)
    const hasTime = doc.startDateTime && (+doc.startDateTime.slice(11,13) || +doc.startDateTime.slice(14,16));
    const locationName = typeof doc.location === 'object' && doc.location !== null ? (doc.location.name || '') : (doc.location || '');
    return {
      id:       doc.slug?.current || doc._id,
      title:    doc.title?.en || '',
      titleAr:  doc.title?.ar || '',
      subtitle:   doc.subtitle?.en || '',
      subtitleAr: doc.subtitle?.ar || '',
      type:     doc.eventType || '',
      colorTheme: doc.colorTheme || '',
      day:      s ? String(s.getDate()).padStart(2,'0') : '01',
      month:    s ? MABBR[s.getMonth()] : 'Jan',
      year:     s ? s.getFullYear() : new Date().getFullYear(),
      dow:      s ? DWEN[s.getDay()] : 'Mon',
      dowAr:    s ? DWAR[s.getDay()] : '',
      dowFull:  s ? DWFULL[s.getDay()] : '',
      monthFull: s ? MFULL[s.getMonth()] : '',
      dayOrdinal: s ? _ordinal(s.getDate()) : '',
      start:    hasTime ? s.toTimeString().slice(0,5) : '',
      end:      doc.endDateTime && (+doc.endDateTime.slice(11,13)||+doc.endDateTime.slice(14,16)) ? e.toTimeString().slice(0,5) : '',
      filmDuration: doc.filmDuration || null,
      // Multi-day (exhibitions and other long-running things): keep the
      // closing DATE so the header can show a range instead of times.
      endDate:  (e && (e.getFullYear() !== s.getFullYear() || e.getMonth() !== s.getMonth() || e.getDate() !== s.getDate()))
        ? { day: e.getDate(), dayOrdinal: _ordinal(e.getDate()), monthFull: MFULL[e.getMonth()], monthAr: MONTH_NAME_AR[MABBR[e.getMonth()]], year: e.getFullYear() }
        : null,
      location: locationName,
      recurring: !!doc.recurring,
      status:   doc.status || 'upcoming',
      featured: !!doc.featured,
      register: doc.registerUrl || '',
      streamChannel: doc.streamChannel ? { name: doc.streamChannel.name || '', url: doc.streamChannel.streamUrl || '' } : null,
      isPast:   s ? s < new Date() : (doc.status === 'past'),
      // Registration should stay open (clickable) for the event's full
      // duration, not just until it starts — only disable it once the
      // event has actually ended. Falls back to the start-based rule when
      // there's no endDateTime to compare against.
      registerEnded: e ? e < new Date() : (s ? s < new Date() : (doc.status === 'past')),
      short:    doc.shortDescription?.en || '',
      shortAr:  doc.shortDescription?.ar || '',
      body:     doc.body?.en ? doc.body.en.split(/\n\n+/).map(p=>p.trim()).filter(Boolean) : [],
      bodyAr:   doc.body?.ar ? doc.body.ar.split(/\n\n+/).map(p=>p.trim()).filter(Boolean) : [],
      writeup:   doc.writeup?.en || '',
      writeupAr: doc.writeup?.ar || '',
      cover:    _sanityImg(doc.cover),
      coverPalette: _pickPalette(doc.coverPalette),
      content:  doc.content || [],
      relatedArtists: (doc.relatedArtists||[]).map(a => ({
        name: a.name?.en || a.name?.ar || '', nameAr: a.name?.ar || '', slug: a.slug || '',
        bio:   a.bio?.en ? a.bio.en.split(/\n\n+/).map(p => p.trim()).filter(Boolean) : [],
        bioAr: a.bio?.ar ? a.bio.ar.split(/\n\n+/).map(p => p.trim()).filter(Boolean) : [],
      })).filter(a => a.name),
      relatedProject: doc.relatedProject ? { title: _loc(doc.relatedProject.title), slug: doc.relatedProject.slug?.current || '' } : null,
      programmeEvents: (doc.programmeEvents || []).map(pe => {
        const ps = _iso(pe.startDateTime);
        return {
          id: pe.slug || pe._id,
          title: pe.title?.en || '',
          titleAr: pe.title?.ar || '',
          type: pe.eventType || '',
          day: ps ? String(ps.getDate()).padStart(2,'0') : '',
          month: ps ? MABBR[ps.getMonth()] : '',
          monthFull: ps ? MFULL[ps.getMonth()] : '',
          start: ps && (ps.getHours()||ps.getMinutes()) ? ps.toTimeString().slice(0,5) : '',
        };
      }),
    };
  }

  function _renderBlocks(content){
    if (!content || !content.length) return "";
    return content.map(b => {
      const kind = (b._type || b.type || '').replace(/^content/, '').toLowerCase();
      switch(kind){
        case "text": {
          const enHtml = (b.en||[]).map(p=>`<p>${p}</p>`).join("");
          const arHtml = (b.ar||[]).map(p=>`<p>${p}</p>`).join("");
          return `<div class="cb-text">${enHtml?`<div class="en-only">${enHtml}</div>`:""}${arHtml?`<div class="ar-only ar" dir="rtl">${arHtml}</div>`:""}</div>`;
        }
        case "image": {
          const src = _sanityImg(b.image);
          if (!src) return "";
          return `<div class="cb-image"><img src="${src}" alt="${b.captionEn||""}">${(b.captionEn||b.captionAr)?`<div class="cb-caption"><span class="en-only">${b.captionEn||""}</span><span class="ar-only ar" dir="rtl">${b.captionAr||""}</span></div>`:""}</div>`;
        }
        case "pullquote":
          return `<blockquote class="cb-quote">${b.en?`<p class="en-only">${b.en}</p>`:""}${b.ar?`<p class="ar-only ar" dir="rtl">${b.ar}</p>`:""}${b.attribution?`<cite>${b.attribution}</cite>`:""}</blockquote>`;
        case "audio": {
          const src = _sanityFile(b.audioFile) || b.externalUrl || '';
          return `<div class="cb-audio"><div class="cb-audio-head"><span class="cb-audio-icon">◉</span><span class="cb-audio-title"><span class="en-only">${b.titleEn||"Audio"}</span><span class="ar-only ar">${b.titleAr||b.titleEn||"صوت"}</span></span>${b.durationMin?`<span class="cb-audio-dur">${b.durationMin} min</span>`:""}</div>${src?`<audio controls src="${src}" style="width:100%;margin-top:10px;"></audio>`:`<div class="cb-audio-placeholder"><span class="en-only">Recording will appear here after the event</span><span class="ar-only ar" dir="rtl">سيظهر التسجيل هنا بعد الفعالية</span></div>`}</div>`;
        }
        case "video": {
          const src = _sanityFile(b.videoFile) || '';
          const cap = (b.captionEn||b.captionAr) ? `<div class="cb-caption"><span class="en-only">${b.captionEn||""}</span><span class="ar-only ar" dir="rtl">${b.captionAr||""}</span></div>` : "";
          if (b.externalUrl) return `<div class="cb-video"><div class="cb-video-frame"><iframe src="${b.externalUrl}" allowfullscreen></iframe></div>${cap}</div>`;
          if (src) return `<div class="cb-video"><video controls src="${src}" style="width:100%;display:block;border-radius:16px;"></video>${cap}</div>`;
          return `<div class="cb-video-placeholder"><span class="en-only">Video</span><span class="ar-only ar">فيديو</span></div>`;
        }
        case "gallery": {
          const imgs = (b.images||[]).map(img=>{ const s=_sanityImg(img); return s?`<div class="cb-gal-item"><img src="${s}" alt=""></div>`:''; }).join("");
          return imgs ? `<div class="cb-gallery">${imgs}</div>` : "";
        }
        case "divider": return `<hr class="cb-divider">`;
        default: return "";
      }
    }).join("");
  }

  function _findAdjacentEvents(all, currentId){
    const idx = all.findIndex(e => e.id === currentId);
    if (idx === -1) return { prev: null, next: null };
    // Events are sorted newest-first (desc), so idx-1 is later, idx+1 is earlier.
    return { prev: idx < all.length - 1 ? all[idx + 1] : null, next: idx > 0 ? all[idx - 1] : null };
  }

  function _initLiveStream(root){
    const btn = root.querySelector(".epl-play");
    if (!btn) return;
    const iconPlay = root.querySelector(".epl-icon-play"),
          iconPause = root.querySelector(".epl-icon-pause"),
          audio = root.querySelector(".epl-audio"),
          url = audio ? audio.getAttribute("src") : "";

    // When opened as the homepage's own in-grid reader (a same-origin
    // iframe), share the exact <audio> element the hero cards' Play
    // buttons use instead of this bar's own local one — see the comment
    // on window._wcStreamAudio in index.html for why: without this, a
    // stream already playing from a card showed "play" (not "pause") the
    // moment you opened that same event's reader, since the reader had no
    // idea the parent page was already playing it.
    let parentAudio = null;
    if (EMBED) {
      try { parentAudio = window.parent && window.parent !== window ? window.parent._wcStreamAudio : null; } catch(_){ parentAudio = null; }
    }

    if (parentAudio && url) {
      const sync = () => {
        const playing = !parentAudio.paused && parentAudio.src === url;
        iconPlay.style.display = playing ? "none" : "";
        iconPause.style.display = playing ? "" : "none";
      };
      btn.addEventListener("click", () => window.parent._wcToggleStream(url));
      parentAudio.addEventListener("play", sync);
      parentAudio.addEventListener("pause", sync);
      sync();
    } else if (audio) {
      btn.addEventListener("click", () => audio.paused ? audio.play().catch(() => {}) : audio.pause());
      audio.addEventListener("play",  () => { iconPlay.style.display = "none"; iconPause.style.display = ""; });
      audio.addEventListener("pause", () => { iconPlay.style.display = "";     iconPause.style.display = "none"; });
    }
  }

  function _initPanelAudio(root){
    const audio = root.querySelector(".epa-audio");
    if (!audio) return;
    const playBtn = root.querySelector(".epa-play"), iconPlay = root.querySelector(".epa-icon-play"),
          iconPause = root.querySelector(".epa-icon-pause"), fill = root.querySelector(".epa-fill"),
          seek = root.querySelector(".epa-seek"), curr = root.querySelector(".epa-current"), tot = root.querySelector(".epa-total");
    function fmt(s){ if (isNaN(s)||!isFinite(s)) return "--:--"; return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); }
    playBtn.addEventListener("click", () => audio.paused ? audio.play() : audio.pause());
    audio.addEventListener("play",  () => { iconPlay.style.display="none"; iconPause.style.display=""; });
    audio.addEventListener("pause", () => { iconPlay.style.display="";     iconPause.style.display="none"; });
    audio.addEventListener("ended", () => { fill.style.width="0%"; seek.value=0; curr.textContent="0:00"; iconPlay.style.display=""; iconPause.style.display="none"; });
    audio.addEventListener("timeupdate", () => {
      const pct = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
      fill.style.width = pct+"%"; seek.value = pct; curr.textContent = fmt(audio.currentTime);
    });
    audio.addEventListener("loadedmetadata", () => { tot.textContent = fmt(audio.duration); });
    seek.addEventListener("input", () => { if (audio.duration) audio.currentTime = (seek.value/100)*audio.duration; });
  }

  // The single canonical event template — identical output regardless of
  // where the user came from, since every entry point now just links here.
  function buildEventPanel(ev, all){
    const typeArLabel = TYPE_AR[ev.type] || ev.type;
    const venue = (ev.location || "").split("·")[0].trim();
    const coverHtml = (ev.cover && !(ev.content && ev.content.length))
      ? `<div class="ep-cover ep-cover-full"><img src="${ev.cover}" alt="" style="width:100%;height:auto;display:block;"></div>`
      : "";
    const bodyEnParts = [...(ev.short ? [ev.short] : []), ...(ev.body && ev.body.length ? ev.body : [])];
    const bodyArParts = [...(ev.shortAr ? [ev.shortAr] : []), ...(ev.bodyAr && ev.bodyAr.length ? ev.bodyAr : [])];
    const bodyEn = bodyEnParts.map(p => `<p>${p}</p>`).join("");
    const bodyAr = bodyArParts.map(p => `<p>${p}</p>`).join("");
    const writeupEn = ev.writeup ? `<p class="ep-writeup">${ev.writeup}</p>` : "";
    const writeupAr = ev.writeupAr ? `<p class="ep-writeup" dir="rtl">${ev.writeupAr}</p>` : "";
    const cta = ev.register
      ? (ev.registerEnded
          ? `<span class="ep-register ep-register-disabled" aria-disabled="true"><span class="en-only">Registration closed</span><span class="ar-only ar">التسجيل مغلق</span></span>`
          : `<a href="${ev.register}" class="ep-register" target="_blank"><span class="en-only">Register →</span><span class="ar-only ar">← التسجيل</span></a>`)
      : (!ev.isPast ? `<span class="ep-register ep-free"><span class="en-only">Free entry</span><span class="ar-only ar">دخول حرّ</span></span>` : "");

    // Audio bar sourced from a contentAudio block, if present.
    const audioSrcBlock = (ev.content || []).find(b => (b._type||'') === 'contentAudio');
    const audioSrc = audioSrcBlock ? (_sanityFile(audioSrcBlock.audioFile) || audioSrcBlock.externalUrl || '') : '';
    const audioBar = (audioSrcBlock && audioSrc) ? `
<div class="ep-audio-bar">
  <audio class="epa-audio" src="${audioSrc}" preload="metadata"></audio>
  <button class="epa-play" aria-label="Play / Pause">
    <svg class="epa-icon-play"  viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
    <svg class="epa-icon-pause" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>
  <div class="epa-track">
    <div class="epa-label"><span class="en-only">${audioSrcBlock.titleEn||"Recording"}</span><span class="ar-only ar">${audioSrcBlock.titleAr||audioSrcBlock.titleEn||"تسجيل"}</span></div>
    <div class="epa-progress-wrap">
      <div class="epa-progress"><div class="epa-fill"></div></div>
      <input type="range" class="epa-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    </div>
  </div>
  <div class="epa-time"><span class="epa-current">0:00</span> / <span class="epa-total">${audioSrcBlock.durationMin ? audioSrcBlock.durationMin+":00" : "--:--"}</span></div>
</div>` : "";

    // Live stream bar — a radio episode/listening session with a Sanity
    // streamChannel reference set (name + URL live on that separate
    // document, editable in Studio without a code deploy). No seek bar/
    // duration (it's a live feed, not a fixed recording) — just play/pause
    // and a "live" indicator, unlike the contentAudio bar above.
    const streamUrl = ev.streamChannel && ev.streamChannel.url;
    const streamLabel = (ev.streamChannel && ev.streamChannel.name) || "";
    const liveStreamBar = streamUrl ? `
<div class="ep-live-bar">
  <audio class="epl-audio" src="${streamUrl}" preload="none"></audio>
  <button class="epl-play" aria-label="Play live stream">
    <svg class="epl-icon-play"  viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
    <svg class="epl-icon-pause" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>
  <div class="epl-label">
    <span class="epl-live-dot"></span>
    <span class="en-only">Listen live${streamLabel ? " — " + streamLabel : ""}</span>
    <span class="ar-only ar" dir="rtl">استمع مباشرة${streamLabel ? " — " + streamLabel : ""}</span>
  </div>
</div>` : "";

    const { prev, next } = _findAdjacentEvents(all, ev.id);
    // Adjacent-event links must stay in embed mode when we're already
    // embedded (in-grid reader, desktop or mobile) — otherwise following
    // one strands a full standalone page nested inside the reader, whose
    // own ✕ then loads the entire homepage nested inside itself. The
    // desktop reader used to patch this up client-side by rewriting the
    // href on click; baking it in here fixes it at the source for every
    // entry point, including mobile's native (unforwarded) taps.
    const navSuffix = EMBED ? "&embed=1" : "";
    const navBar = `
<div class="ep-nav">
  ${prev ? `<a href="event.html?id=${prev.id}${navSuffix}" class="ep-nav-btn ep-nav-prev">
    <span class="ep-nav-dir"><span class="en-only">← Prev</span><span class="ar-only ar">التالي →</span></span>
    <span class="ep-nav-name"><span class="en-only">${prev.title}</span><span class="ar-only ar">${prev.titleAr||prev.title}</span></span>
  </a>` : `<div class="ep-nav-btn ep-nav-empty"></div>`}
  ${next ? `<a href="event.html?id=${next.id}${navSuffix}" class="ep-nav-btn ep-nav-next">
    <span class="ep-nav-dir"><span class="en-only">Next →</span><span class="ar-only ar">← السابق</span></span>
    <span class="ep-nav-name"><span class="en-only">${next.title}</span><span class="ar-only ar">${next.titleAr||next.title}</span></span>
  </a>` : `<div class="ep-nav-btn ep-nav-empty"></div>`}
</div>`;

    // Embed mode: pull the event's video (the same one the grid card uses
    // as its background) up to the very top of the flow, so it scrolls
    // away as you read — and don't render it twice down in the blocks.
    let contentBlocks = ev.content || [];
    let heroVideoHtml = "";
    if (EMBED) {
      const vb = contentBlocks.find(b => (b._type || '') === 'contentVideo');
      const vsrc = vb ? (_sanityFile(vb.videoFile) || '') : '';
      if (vsrc) {
        heroVideoHtml = `<div class="ep-hero-video"><video autoplay muted loop playsinline src="${vsrc}"></video></div>`;
        contentBlocks = contentBlocks.filter(b => b !== vb);
      }
    }
    const popBtn = EMBED
      ? `<a class="ep-pop" href="event.html?id=${encodeURIComponent(ev.id)}" target="_top" aria-label="Open as its own page"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3H3v12h12v-4M10 3h5v5M14 4l-7 7"/></svg></a>`
      : "";
    const closeBtn = EMBED
      ? `<a class="ep-close" id="epClose" href="index.html" aria-label="Back"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l10 10M14 4L4 14"/></svg></a>`
      : "";

    return `
${liveStreamBar}
${audioBar}
<div class="ep-header">
  <div class="ep-meta">
    <div class="dt-block${ev.endDate ? ' dt-range' : ''}">
      ${ev.endDate ? `
      <span class="en-only">${ev.monthFull} ${ev.dayOrdinal} —<br>${ev.endDate.monthFull} ${ev.endDate.dayOrdinal}, ${ev.endDate.year}</span>
      <span class="ar-only ar">${ev.day} ${MONTH_NAME_AR[ev.month]} — ${arNum(ev.endDate.day)} ${ev.endDate.monthAr} ${arNum(ev.endDate.year)}</span>
      ` : `
      <span class="en-only">${ev.dowFull ? `${ev.dowFull}<br>${ev.monthFull} ${ev.dayOrdinal}, ${ev.year}` : _overlayDate(ev)}</span>
      <span class="ar-only ar">${ev.dowAr ? `${ev.dowAr}<br>` : ""}${ev.day} ${MONTH_NAME_AR[ev.month]} ${arNum(ev.year)}</span>
      <span class="ep-time">${ev.start}${ev.end ? " — " + ev.end : ""}${ev.filmDuration ? ` <span class="ep-duration">(${ev.filmDuration} min)</span>` : ""}</span>
      `}
    </div>
    ${ev.register
      ? (ev.registerEnded
          ? `<span class="ep-register-header ep-register-disabled" aria-disabled="true">
      <span class="en-only">Registration closed</span><span class="ar-only ar" dir="rtl">التسجيل مغلق</span>
    </span>`
          : `<a href="${ev.register}" class="ep-register-header" target="_blank" rel="noopener">
      <span class="en-only">Register →</span><span class="ar-only ar" dir="rtl">← سجّل الآن</span>
    </a>`)
      : ""}
    <div class="ep-meta-bottom">
      <span class="ep-type-tag en-only">${ev.type}</span>
      <span class="ep-type-tag ar-only ar">${typeArLabel}</span>
      <div class="ep-header-icons">
        ${popBtn}
        ${closeBtn}
      </div>
    </div>
  </div>
  <h1 class="ep-title">
    <span class="en-only">${ev.title}</span>
    <span class="ar-only ar" dir="rtl">${ev.titleAr || ev.title}</span>
  </h1>
  ${(ev.subtitle && !(ev.content && ev.content.length)) ? `<p class="ep-subtitle en-only">${ev.subtitle}</p>` : ""}
</div>
<div class="ep-body">
  ${heroVideoHtml}
  ${coverHtml}
  <div class="ep-content">
    ${contentBlocks && contentBlocks.length
      ? `<div class="ep-content-blocks">${_renderBlocks(contentBlocks)}</div>`
      : ""}
    ${(bodyEn || bodyAr) ? `
    <div class="ep-text">
      ${bodyEn ? `<div class="en-only">${bodyEn}</div>` : ""}
      ${writeupEn ? `<div class="en-only">${writeupEn}</div>` : ""}
      ${bodyAr ? `<div class="ar-only ar" dir="rtl">${bodyAr}</div>` : ""}
      ${writeupAr ? `<div class="ar-only ar" dir="rtl">${writeupAr}</div>` : ""}
    </div>` : ""}
    ${(ev.subtitle && ev.content && ev.content.length) ? `<p class="ep-subtitle en-only">${ev.subtitle}</p>` : ""}
    <div class="ep-facts">
      <div class="ep-fact">
        <span class="ef-key"><span class="en-only">Venue</span><span class="ar-only ar">المكان</span></span>
        <span class="ef-leader"></span>
        <span class="ef-val">${venue || "—"}</span>
      </div>
      <div class="ep-fact">
        <span class="ef-key"><span class="en-only">Time</span><span class="ar-only ar">التوقيت</span></span>
        <span class="ef-leader"></span>
        <span class="ef-val">${ev.start}${ev.end ? " — " + ev.end : ""}</span>
      </div>
      <div class="ep-fact">
        <span class="ef-key"><span class="en-only">Date</span><span class="ar-only ar">التاريخ</span></span>
        <span class="ef-leader"></span>
        <span class="ef-val en-only">${_overlayDate(ev)}</span>
        <span class="ef-val ar-only ar">${ev.day} ${MONTH_NAME_AR[ev.month]}</span>
      </div>
      <div class="ep-fact">
        <span class="ef-key"><span class="en-only">Type</span><span class="ar-only ar">النوع</span></span>
        <span class="ef-leader"></span>
        <span class="ef-val"><span class="en-only">${ev.type}</span><span class="ar-only ar">${typeArLabel}</span></span>
      </div>
      ${ev.relatedArtists && ev.relatedArtists.length ? `<div class="ep-fact">
        <span class="ef-key"><span class="en-only">Artists</span><span class="ar-only ar">فنانون</span></span>
        <span class="ef-leader"></span>
        <span class="ef-val">${ev.relatedArtists.map(a => {
          const inner = `<span class="en-only">${a.name}</span><span class="ar-only ar">${a.nameAr || a.name}</span>`;
          return a.slug
            ? `<a class="ep-person-link" href="artist.html?id=${encodeURIComponent(a.slug)}"${EMBED ? ' target="_top"' : ''}>${inner}</a>`
            : inner;
        }).join(', ')}</span>
      </div>` : ""}
      ${ev.relatedProject ? `<div class="ep-fact">
        <span class="ef-key"><span class="en-only">Part of</span><span class="ar-only ar">جزء من</span></span>
        <span class="ef-leader"></span>
        <span class="ef-val">${ev.relatedProject.title}</span>
      </div>` : ""}
    </div>
    ${cta}
  </div>
  ${EMBED ? '<div class="ep-embed-spacer" aria-hidden="true"></div>' : ""}
  ${(ev.programmeEvents && ev.programmeEvents.length) ? `
  <div class="ep-programme">
    <div class="ep-programme-head">
      <span class="en-only">Programme</span>
      <span class="ar-only ar" dir="rtl">البرنامج</span>
    </div>
    ${ev.programmeEvents.map(pe => `
      <a class="ep-prog-row" data-ev="${pe.id}" href="event.html?id=${pe.id}${navSuffix}">
        <span class="ep-prog-date">${parseInt(pe.day,10)} ${pe.monthFull}</span>
        <span class="ep-prog-type">${pe.type}</span>
        <span class="ep-prog-name">
          <span class="en-only">${pe.title}</span>
          <span class="ar-only ar" dir="rtl">${pe.titleAr||pe.title}</span>
        </span>
        <span class="ep-prog-arrow">→</span>
      </a>`).join("")}
  </div>` : ""}
  ${(ev.relatedArtists && ev.relatedArtists.length) ? `
  <div class="ep-related-artists">
    <div class="ep-related-artists-head">
      <span class="en-only">Related Artists</span>
      <span class="ar-only ar" dir="rtl">فنانون ذوو صلة</span>
    </div>
    ${ev.relatedArtists.map(a => {
      const nameInner = `<span class="en-only">${a.name}</span><span class="ar-only ar" dir="rtl">${a.nameAr || a.name}</span>`;
      const nameHtml = a.slug
        ? `<a class="ep-related-artist-name" href="artist.html?id=${encodeURIComponent(a.slug)}"${EMBED ? ' target="_top"' : ''}>${nameInner}</a>`
        : `<div class="ep-related-artist-name">${nameInner}</div>`;
      const hasBio = (a.bio && a.bio.length) || (a.bioAr && a.bioAr.length);
      return `<div class="ep-related-artist">
        ${nameHtml}
        ${hasBio ? `<div class="ep-related-artist-bio">
          ${a.bio && a.bio.length ? `<div class="en-only">${a.bio.map(p => `<p>${p}</p>`).join('')}</div>` : ''}
          ${a.bioAr && a.bioAr.length ? `<div class="ar-only ar" dir="rtl">${a.bioAr.map(p => `<p>${p}</p>`).join('')}</div>` : ''}
        </div>` : ''}
      </div>`;
    }).join("")}
  </div>` : ""}
  ${navBar}
</div>`;
  }

  const params = new URLSearchParams(location.search);
  const id = params.get('id') || '';
  const EMBED = params.get('embed') === '1';
  if (EMBED) document.documentElement.classList.add('embed');
  const _post = m => { try { if (window.parent !== window) window.parent.postMessage(m, '*'); } catch(_){} };
  const BASE = `https://${SANITY_PROJECT}.api.sanity.io/v2024-01-01/data/query/${SANITY_DATASET}?query=`;
  async function groq(query){ const res = await fetch(BASE + encodeURIComponent(query)); const json = await res.json(); return json.result; }

  let ev, all = [];
  try {
    // Footer (address/hours/maps/social) is owned by assets/footer.js now,
    // which does its own siteSettings fetch — nothing to do here for it.
    const docs = await groq(`*[_type == "event"] | order(startDateTime desc) { ..., location->{ name }, relatedArtists[]->{name, "slug": slug.current, bio}, relatedProject->{title, slug}, programmeEvents[]->{_id, "slug": slug.current, title, eventType, startDateTime}, "coverPalette": cover.asset->metadata.palette, streamChannel->{name, streamUrl} }`);
    all = (docs || []).map(docToEv);
    ev = all.find(e => e.id === id);
  } catch(err) { console.warn('[WC] event fetch failed', err); }

  if (!ev) {
    document.getElementById('epRoot').innerHTML = `<div class="ep-header"><h1 class="ep-title">Event not found.</h1><p class="ep-subtitle"><a href="index.html">← Back to programme</a></p></div>`;
    return;
  }

  const root = document.getElementById('epRoot');

  // Mount an event into the page — called on first load and on programme-row clicks.
  function mountEvent(targetEv) {
    const tc = _colorFor(targetEv, { bg: "#1d24ff", ink: "#f6f3ea" });
    // Theme the reader from Sanity's precomputed image palette, matching
    // the same accent used elsewhere on the site (e.g. the Current
    // Exhibitions unit). Falls back to the static type color when no
    // palette exists (old assets, SVGs). Resolved once, up front, so
    // every place below that paints the theme (root, --bg/--ink vars,
    // body background) agrees — previously the palette color was set
    // here and then unconditionally overwritten back to the flat
    // Exhibition-type blue a few lines down.
    const useTheme = (targetEv.type === 'Exhibition' && targetEv.coverPalette) ? targetEv.coverPalette : tc;
    root.style.background = useTheme.bg;
    root.style.color = useTheme.ink;
    root.innerHTML = buildEventPanel(targetEv, all);
    _initPanelAudio(root);
    _initLiveStream(root);
    window.scrollTo(0, 0);
    // Update title + OG
    const titleStr = targetEv.titleAr ? `${targetEv.title} · ${targetEv.titleAr}` : targetEv.title;
    document.title = `${titleStr} – The Wonder Cabinet`;
    const _ogTitle = document.getElementById('og-title-meta');
    const _ogDesc  = document.getElementById('og-desc-meta');
    const _ogImg   = document.getElementById('og-image-meta');
    if (_ogTitle) _ogTitle.setAttribute('content', `${targetEv.title} – The Wonder Cabinet`);
    if (_ogDesc && targetEv.short) _ogDesc.setAttribute('content', targetEv.short);
    if (_ogImg && targetEv.cover) _ogImg.setAttribute('content', targetEv.cover);
    // Update URL (standalone only — EMBED stays in the iframe)
    if (!EMBED) {
      history.pushState({id: targetEv.id}, '', `event.html?id=${encodeURIComponent(targetEv.id)}`);
    }
    document.documentElement.style.setProperty('--bg', useTheme.bg);
    document.documentElement.style.setProperty('--ink', useTheme.ink);
    document.body.style.background = useTheme.bg;
  }

  // Document-level delegation — survives every innerHTML swap
  document.addEventListener('click', function(e) {
    // Close / back button
    if (e.target.closest('#epClose, .ep-close')) {
      if (EMBED) { e.preventDefault(); _post({ type: 'wc-close' }); return; }
      if (document.referrer && document.referrer.indexOf(location.origin) === 0 && history.length > 1) {
        e.preventDefault(); history.back();
      }
      return;
    }
    // Programme row — always expand inline (mountEvent handles both EMBED and standalone)
    const progRow = e.target.closest('.ep-prog-row[data-ev]');
    if (progRow) {
      e.preventDefault();
      const targetEv = all.find(ev => ev.id === progRow.dataset.ev);
      if (targetEv) mountEvent(targetEv);
    }
  });

  mountEvent(ev);

  if (EMBED) {
    // Fill the whole frame with the event's theme color (no page margins).
    // (mountEvent already sets it, but set it here too before first paint.)
    // Prefer the exhibition's own poster palette over the static type
    // fallback — mountEvent() already resolved this once; re-deriving it
    // here with plain _colorFor() (which ignores coverPalette) was
    // clobbering the correct poster green with the generic Exhibition
    // blue (#1d24ff) right after paint.
    const tc = (ev.type === 'Exhibition' && ev.coverPalette) ? ev.coverPalette : _colorFor(ev, { bg: "#1d24ff", ink: "#f6f3ea" });
    document.documentElement.style.setProperty('--bg', tc.bg);
    document.documentElement.style.setProperty('--ink', tc.ink);
    document.body.style.background = tc.bg;

    // Report scroll position to the parent — it maps the first stretch of
    // scrolling onto the block's expansion from card-size to full-area.
    window.addEventListener('scroll', () => _post({ type: 'wc-scroll', y: window.scrollY }), { passive: true });

    // Gravity at both ends: over-scrolling past the bottom (or back past
    // the top) doesn't close the reader immediately — the pull amount is
    // streamed to the parent, which squeezes the block in response, and
    // only a sustained pull past the threshold breaks it out and
    // collapses the page back into the grid. Letting go springs it back.
    const PULL_MAX = 700;
    let _pull = 0, _pullTimer = null;
    // Firefox fires wheel events with deltaMode=1 ("line") for a plain mouse
    // wheel, where deltaY is a small line count instead of a pixel distance
    // (Chrome normalizes wheel input to pixel deltas regardless of device).
    // PULL_MAX is a pixel-scale threshold, so without normalizing this the
    // same physical gesture takes far more ticks to trigger the collapse in
    // Firefox on a plain wheel than it does in Chrome.
    function _epWheelDeltaY(e){
      var d = e.deltaY;
      if (e.deltaMode === 1) d *= 16;
      else if (e.deltaMode === 2) d *= (window.innerHeight || 800);
      return d;
    }
    window.addEventListener('wheel', (e) => {
      const dy = _epWheelDeltaY(e);
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const atBottom = window.scrollY >= max - 2;
      const atTop = window.scrollY <= 1;
      if ((dy > 0 && atBottom) || (dy < 0 && atTop)) {
        // Consume the gesture ourselves — without this, the browser's own
        // overscroll/rubber-band still runs in parallel and once this
        // iframe's document can't scroll any further, it chains the
        // leftover delta out to the PARENT page's scroll, which is exactly
        // what was wrongly arming the past-archive gravity up there.
        e.preventDefault();
        _pull += Math.abs(dy);
        if (_pull >= PULL_MAX) {
          _pull = -1e9;
          clearTimeout(_pullTimer);
          _post({ type: 'wc-collapse' });
          return;
        }
        _post({ type: 'wc-pull', amount: _pull });
        clearTimeout(_pullTimer);
        _pullTimer = setTimeout(() => {
          _pull = 0;
          _post({ type: 'wc-pull', amount: 0 });
        }, 650);
      } else if (_pull > 0) {
        _pull = 0;
        clearTimeout(_pullTimer);
        _post({ type: 'wc-pull', amount: 0 });
      }
    }, { passive: false });
  }

  // Language toggle
  document.querySelectorAll('[data-lang-btn]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      document.documentElement.setAttribute('data-lang', btn.dataset.langBtn);
      try { localStorage.setItem('twc-lang', btn.dataset.langBtn); } catch(e){}
    });
  });
  try {
    const saved = localStorage.getItem('twc-lang');
    if (saved) {
      document.documentElement.setAttribute('data-lang', saved);
      document.querySelectorAll('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langBtn===saved)));
    }
  } catch(e){}
})();
</script>
</body>
</html>
