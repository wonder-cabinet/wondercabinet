<!doctype html>
<html lang="en" data-lang="both">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Event · The Wonder Cabinet</title>
<link rel="stylesheet" href="assets/app.css?v=2" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span>The Wonder Cabinet</span>
      <span class="dot"></span>
      <span class="ar">مجلس العجب</span>
    </a>
    <div class="topbar-center">Bethlehem · بيت لحم</div>
    <nav class="topbar-right">
      <a href="index.html#programme">Programme</a>
      <a href="index.html#about">About</a>
      <a href="index.html#visit">Visit</a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button data-lang-btn="both" aria-pressed="true">EN+AR</button>
        <button data-lang-btn="en" aria-pressed="false">EN</button>
        <button data-lang-btn="ar" aria-pressed="false">AR</button>
      </div>
    </nav>
  </div>
</header>

<main>
  <article class="detail" id="detail">
    <a class="back" href="index.html">← Back to programme</a>
    <div id="detail-head"></div>
    <div class="detail-cover" id="detail-cover"></div>
    <div class="detail-grid">
      <div class="detail-body" id="detail-body"></div>
      <aside class="facts" id="detail-facts"></aside>
    </div>
  </article>

  <section class="more">
    <h3>Also <em>this month</em></h3>
    <div class="more-grid" id="more-grid"></div>
  </section>
</main>

<footer class="foot">
  <div>
    <div class="brand-foot">The Wonder Cabinet<span class="ar">مجلس العجب</span></div>
  </div>
  <div>
    <div class="k">Visit</div>
    <div class="v">Qaws Zqaq, Bethlehem, Palestine<br><span style="font-family:var(--ff-mono);font-size:12px;letter-spacing:.1em;color:var(--ink-soft);">Wed–Sun · 10:00–22:00</span></div>
  </div>
  <div>
    <div class="k">Correspond</div>
    <div class="v"><a href="#">days@wondercabinet.space</a><br><a href="#">Newsletter</a><br><a href="#">Instagram</a></div>
  </div>
</footer>

<script src="assets/events.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get("id") || EVENTS[0].id;
const ev = EVENTS_BY_ID[id] || EVENTS[0];

document.title = `${ev.title} · The Wonder Cabinet`;

// Head
document.getElementById("detail-head").innerHTML = `
  <div class="detail-kicker">
    <span class="type">${ev.type}</span>
    <span class="sep"></span>
    <span>${ev.dow} ${ev.day} ${ev.month} 2025</span>
    <span class="sep"></span>
    <span>${ev.start}—${ev.end}</span>
    ${ev.featured ? '<span class="sep"></span><span style="color:var(--accent);">Featured</span>' : ''}
  </div>
  <h1>${ev.title}</h1>
  <div class="h1-ar ar" dir="rtl">${ev.titleAr}</div>
`;

// Cover
document.getElementById("detail-cover").innerHTML = `<img src="${ev.cover}" alt="" />`;

// Body
const bodyEn = (ev.body || []).map(p => `<p>${p}</p>`).join("");
const bodyAr = (ev.bodyAr || []).map(p => `<p>${p}</p>`).join("");
document.getElementById("detail-body").innerHTML = `
  <div class="en-only">
    <p><em>${ev.subtitle || ""}</em></p>
    ${bodyEn}
  </div>
  <div class="lang-divider en-only"></div>
  <div class="ar ar-only" dir="rtl">${bodyAr}</div>
`;

// Facts
const facts = [
  ["Date", `${ev.dow} ${ev.day} ${ev.month} 2025`],
  ["Time", `${ev.start} — ${ev.end}`],
  ["Type", ev.type],
  ["Location", ev.location || "The Wonder Cabinet"]
];
document.getElementById("detail-facts").innerHTML = `
  ${facts.map(([k,v]) => `<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}
  ${ev.register ? `<a class="cta" href="${ev.register}" target="_blank" rel="noopener">Register →</a>` : `<a class="cta secondary" href="index.html">Back to programme</a>`}
`;

// More (same month, excluding current)
const more = EVENTS.filter(e => e.month === ev.month && e.id !== ev.id).slice(0, 4);
document.getElementById("more-grid").innerHTML = more.map(e => `
  <a class="week-card" href="event.html?id=${e.id}">
    <div class="wc-date-row">
      <div class="wc-day">${e.day}</div>
      <div class="wc-dow">${e.dow}<span class="ar">${e.dowAr}</span></div>
    </div>
    <div class="wc-type">${e.type} · ${e.start}</div>
    <h3 class="wc-title">${e.title}</h3>
    <div class="wc-meta"><span>${e.location || ""}</span><span class="arrow">→</span></div>
  </a>
`).join("");

/* Language toggle */
document.querySelectorAll("[data-lang-btn]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-lang-btn]").forEach(b => b.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true");
    document.documentElement.setAttribute("data-lang", btn.dataset.langBtn);
    try { localStorage.setItem("twc-lang", btn.dataset.langBtn); } catch(e){}
  });
});
try {
  const saved = localStorage.getItem("twc-lang");
  if (saved) {
    document.documentElement.setAttribute("data-lang", saved);
    document.querySelectorAll("[data-lang-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.langBtn===saved)));
  }
} catch(e){}
</script>
</body>
</html>
